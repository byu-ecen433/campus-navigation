# Parking lot layout.
#
# Each stall pose is that stall's tag in an entrance tag's frame. A tag's frame
# has x pointing out of its printed face and y to the tag's left, the same
# frame tag_pose.tag_in_robot reports.
#   x, y   meters
#   theta  radians, counter-clockwise from the entrance tag's x axis
# Converted from the Lab 6 TRANSFORMS, which put y out of the face and x to
# the tag's right: (x, y, theta) there is (y, -x, theta) here.

entrances:
  - tag: 20
    road: [a, b]        # the lot opens off the road from a toward b
  - tag: 33
    road: [a, b]        

stalls:                 # the stall number from the GUI is the index in this list
  - tag: 24
    pose:               # keyed by entrance tag
      20: {x: 0.6110, y: -0.0873, theta:  0.3459}   # 19.8 deg
      33: {x: 0.6256, y:  0.4228, theta:  0.2395}   # 13.7 deg
  - tag: 25
    pose:
      20: {x: 0.6347, y: -0.4392, theta: -0.0284}   # -1.6 deg
      33: {x: 0.6116, y:  0.0701, theta: -0.1360}   # -7.8 deg
  - tag: 26
    pose:
      20: {x: 0.6220, y: -0.2719, theta:  0.2062}   # 11.8 deg
      33: {x: 0.6166, y:  0.2378, theta:  0.0988}   # 5.7 deg
