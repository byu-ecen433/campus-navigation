# Parking lot layout.
#
# Each stall pose is that stall's tag expressed in an entrance tag's frame:
#   x, y   meters
#   theta  radians, counter-clockwise from the entrance tag's x axis
# Measured with the 2D transforms T[(entrance_tag, stall_tag)].

entrances:
  - tag: 20
    road: [a, b]        # the lot opens off the road from a toward b
  - tag: 33
    road: [a, b]        # TODO: confirm road for this entrance

stalls:                 # the stall number from the GUI is the index in this list
  - tag: 24
    pose:               # keyed by entrance tag
      20: {x:  0.0873, y: 0.6110, theta:  0.3459}   # 19.8 deg
      33: {x: -0.4228, y: 0.6256, theta:  0.2395}   # 13.7 deg
  - tag: 25
    pose:
      20: {x:  0.4392, y: 0.6347, theta: -0.0284}   # -1.6 deg
      33: {x: -0.0701, y: 0.6116, theta: -0.1360}   # -7.8 deg
  - tag: 26
    pose:
      20: {x:  0.2719, y: 0.6220, theta:  0.2062}   # 11.8 deg
      33: {x: -0.2378, y: 0.6166, theta:  0.0988}   # 5.7 deg
